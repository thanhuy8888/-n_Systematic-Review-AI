server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Increase upload limit for PDF files (up to 50MB)
    client_max_body_size 50M;

    # ── API reverse proxy to FastAPI backend ──────────────────────────────
    # Any request starting with /screening or /upload goes to backend
    location ~ ^/(screening|upload)/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long timeout for AI inference (SciBERT/RoBERTa can take 30-60s)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── React SPA fallback ────────────────────────────────────────────────
    # All other routes serve index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
